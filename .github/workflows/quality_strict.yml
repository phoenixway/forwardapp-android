name: Strict Quality (Staged)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

jobs:
  strict-quality:
    name: Detekt + Ktlint Strict
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run strict quality gates
        run: ./gradlew detekt ktlintCheck -PstrictQuality=true --stacktrace

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-quality-reports
          path: |
            app/build/reports/detekt/
            app/build/reports/ktlint/
            app/build/reports/tests/
          retention-days: 14
