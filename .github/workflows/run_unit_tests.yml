name: Run Unit Tests
run-name: ${{ inputs.request_id || github.workflow }}

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Test task'
        required: true
        default: app-prod
        type: choice
        options:
          - app-prod
          - app-exp
          - shared-core-domain
          - shared-core-data-models
      filters:
        description: 'Comma-separated Gradle --tests patterns; blank runs the selected task'
        required: false
        type: string
      request_id:
        description: 'Optional run label for CLI tracking'
        required: false
        type: string

jobs:
  quality:
    name: Quality Gates
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt + Ktlint (report mode)
        run: ./gradlew detekt ktlintCheck --stacktrace

      - name: Enforce changed-files quality gate (PR only)
        if: github.event_name == 'pull_request'
        run: ./tools/quality_changed_files_gate.sh "${BASE_SHA}" "${HEAD_SHA}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}

  test:
    name: Run JVM Unit Tests (${{ matrix.flavor }})
    if: github.event_name != 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [exp, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          FLAVOR_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${FLAVOR:0:1})${FLAVOR:1}"
          TASK="test${FLAVOR_CAP}DebugUnitTest"
          echo "Running JVM unit tests task: $TASK"
          ./gradlew "$TASK" --stacktrace
        env:
          FLAVOR: ${{ matrix.flavor }}

      - name: Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ matrix.flavor }}
          path: app/build/reports/tests/
          retention-days: 7

      - name: Hint for Failed Tests
        if: failure()
        run: |
          echo "Unit tests failed. You can check the detailed HTML report in the artifacts."
          echo "Use 'gh run view --log-failed ${{ github.run_id }}' to see why it failed."

  filtered-test:
    name: Filtered JVM Unit Tests (${{ inputs.target }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run selected tests
        run: bash tools/run-filtered-unit-tests "$TEST_TARGET" "$TEST_FILTERS"
        env:
          TEST_TARGET: ${{ inputs.target }}
          TEST_FILTERS: ${{ inputs.filters }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-tests-${{ inputs.target }}-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            shared-core-domain/build/reports/tests/
            shared-core-domain/build/test-results/
            shared-core-data-models/build/reports/tests/
            shared-core-data-models/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
