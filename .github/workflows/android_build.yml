name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build Flavor'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - exp
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build ${{ inputs.flavor }} ${{ inputs.build_type }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Встановлюємо Java правильно (з кешуванням)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Підготовка підпису тільки для Release
      - name: Prepare Signing (release only)
        if: ${{ inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > release.jks
          echo "storeFile=$(pwd)/release.jks" > signing.properties
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> signing.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing.properties

      # Генерація дебаг-ключа (корисно для стабільності збірки debug)
      - name: Generate debug keystore if not exists
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build with Gradle
        run: |
          FLAVOR="${{ inputs.flavor }}"
          TYPE="${{ inputs.build_type }}"
          
          # Робимо першу літеру великою для назви таски Gradle
          FLAVOR_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${FLAVOR:0:1})${FLAVOR:1}"
          TYPE_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${TYPE:0:1})${TYPE:1}"
          
          TASK="assemble${FLAVOR_CAP}${TYPE_CAP}"
          echo "Running task: $TASK"
          ./gradlew "$TASK" --stacktrace --build-cache --configuration-cache

      # Ваша корисна порада при помилці
      - name: Hint for Failed Build Logs
        if: failure()
        run: |
          echo "The build failed. For more detailed logs, use the GitHub CLI (gh) on your local machine:"
          echo "gh run view --log-failed ${{ github.run_id }}"

      - name: Prepare single APK artifact
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/${{ inputs.flavor }}/${{ inputs.build_type }}"
          mkdir -p artifact-apk

          UNIVERSAL_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name "*universal*.apk" | head -n 1 || true)"
          if [ -n "$UNIVERSAL_APK" ]; then
            SELECTED_APK="$UNIVERSAL_APK"
          else
            SELECTED_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1 || true)"
          fi

          if [ -z "$SELECTED_APK" ]; then
            echo "No APK found in $APK_DIR"
            exit 1
          fi

          cp "$SELECTED_APK" artifact-apk/
          echo "Selected APK: $(basename "$SELECTED_APK")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.flavor }}-${{ inputs.build_type }}
          path: artifact-apk/*.apk
          if-no-files-found: error
          retention-days: 1
